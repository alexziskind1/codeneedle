services:
  # Baked benchmark image — run tests directly
  app:
    build: .
    image: codeneedle:latest
    volumes:
      - ./results:/app/results
    network_mode: host

  # Dev shell — mounts source from host, drop into bash
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    hostname: codeneedle-dev
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - "${PWD:-./}:/app"
    environment:
      - HISTSIZE=-1
      - HISTFILESIZE=-1
    network_mode: host
